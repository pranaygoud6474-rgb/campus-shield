spring:
  datasource:
    url: jdbc:h2:mem:campus_safety_test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:${random.uuid}}

app:
  frontend-url: http://127.0.0.1:5173
